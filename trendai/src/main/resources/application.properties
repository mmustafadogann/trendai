spring.application.name=trendai

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.ai.enabled=${AI_ENABLED:false}
app.ai.demo-mode=${AI_DEMO_MODE:false}

langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo-mode-no-key}
langchain4j.open-ai.chat-model.model-name=${OPENAI_MODEL:gpt-4o-mini}

langchain4j.open-ai.chat-model.timeout=30s
langchain4j.open-ai.chat-model.max-retries=1
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false